name: bookmyvenue

services:

  backend:
    container_name: bookmyvenue_backend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8011:8000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --graceful-timeout 30

  db:
    image: postgres:16
    container_name: bookmyvenue_db
    volumes:
      - bookmyvenue_db:/var/lib/postgresql/data/
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    container_name: bookmyvenue_redis
    restart: unless-stopped

  celery:
    container_name: bookmyvenue_celery
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A config worker --loglevel=info

  celery_beat:
    container_name: bookmyvenue_celery_beat
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A config beat --loglevel=info

volumes:
  bookmyvenue_db: